syntax = "proto3";

package ticketservice.v1;

service TicketClientService {
  // Explicit sign-up (replicated through Raft). Login fails for unknown users.
  rpc Register(RegisterRequest) returns (StatusResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (StatusResponse);
  rpc Post(PostRequest) returns (StatusResponse);
  rpc Get(GetRequest) returns (GetResponse);
}

service TicketAppService {
  rpc ProcessBusinessRequest(BusinessRequest) returns (StatusResponse);
  rpc GetLLMAnswer(LLMQueryRequest) returns (GetLLMAnswerResponse);
  // Cluster administration (operator tools, see scripts/cluster_admin.py)
  rpc ChangeMembership(MembershipChangeRequest) returns (StatusResponse);
  rpc TransferLeadership(TransferLeadershipRequest) returns (StatusResponse);
}

service LLMService {
  rpc GetLLMAnswer(LLMQueryRequest) returns (GetLLMAnswerResponse);
  // Natural-language booking assistant: turns a citizen's sentence into a
  // JSON intent (action, vaccine, city, dose, booking id). The answer field
  // carries the JSON; the app server validates it before acting.
  rpc ExtractIntent(LLMQueryRequest) returns (GetLLMAnswerResponse);
}

// ============ RAFT CONSENSUS SERVICE ============

service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  // Log compaction (Raft paper section 7): leader ships its snapshot to a
  // follower whose next entry has already been compacted away.
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
  // Leadership transfer (Raft thesis 3.10): tells a caught-up follower to
  // start an election immediately.
  rpc TimeoutNow(TimeoutNowRequest) returns (TimeoutNowResponse);
}

// --- Messages for Client Functions ---

message RegisterRequest {
  string username = 1;
  string password = 2;
  string role = 3;        // "citizen" (default) or "admin"
  string admin_code = 4;  // required for role "admin" (cluster sign-up code)
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string status = 1;
  optional string token = 2;
  string leader_hint = 3; // "host:port" or client address for leader redirect
  string message = 4;     // human-readable detail (e.g. "no quorum")
  string role = 5;        // role of the logged-in account ("citizen" or "admin")
}

message LogoutRequest {
  string token = 1;
}

message StatusResponse {
  string status = 1;
  string message = 2;
  string leader_hint = 3;
}

message PostRequest {
  string token = 1;
  string type = 2;
  string data = 3; // JSON string containing payload (e.g. ticket_id, quantity)
  string request_id = 4; // client-chosen id, identical across retries -> exactly-once writes
}

message GetRequest {
  string token = 1;
  string type = 2;
  optional string params = 3; // JSON string or query parameter
}

message DataItem {
  string id = 1;
  string data = 2; // JSON string representing the object
}

message GetResponse {
  string status = 1;
  repeated DataItem items = 2;
  string leader_hint = 3;
}

// --- Messages for Application Server Functions ---

message BusinessRequest {
  string request_id = 1;
  string payload = 2; // JSON string
  string context = 3; // JSON string
}

// --- Messages for LLM Server Functions ---

message LLMQueryRequest {
  string request_id = 1;
  string query = 2;
  string context = 3;
}

message GetLLMAnswerResponse {
  string request_id = 1;
  string answer = 2;
}

// Alias for backward compatibility
message LLMQueryResponse {
  string request_id = 1;
  string answer = 2;
}

// --- Messages for Raft Consensus ---

message RequestVoteRequest {
  string from_node = 1;      // candidateId
  string to_node = 2;        // candidate target
  int64 term = 3;            // candidate's term
  int64 last_log_index = 4;  // index of candidate's last log entry
  int64 last_log_term = 5;   // term of candidate's last log entry
  bool pre_vote = 6;            // Pre-Vote round: receiver answers but changes no state
  bool leadership_transfer = 7; // sent after TimeoutNow: bypasses the "leader is alive" check
}

message RequestVoteResponse {
  string from_node = 1;      // responding node
  string to_node = 2;        // candidate
  int64 term = 3;            // currentTerm, for candidate to update itself
  bool vote_granted = 4;     // true means candidate received vote
}

message RaftLogEntry {
  int64 term = 1;
  int64 index = 2;
  string command_type = 3;   // "create_booking", "cancel_booking", "login", "logout"
  string command_json = 4;   // JSON-serialized command dictionary
}

message AppendEntriesRequest {
  string from_node = 1;      // leaderId
  string to_node = 2;        // follower
  int64 term = 3;            // leader's term
  int64 prev_log_index = 4;  // index of log entry immediately preceding new ones
  int64 prev_log_term = 5;   // term of prev_log_index entry
  int64 commit_index = 6;    // leader's commitIndex
  repeated RaftLogEntry entries = 7; // log entries to store (empty for heartbeat)
}

message AppendEntriesResponse {
  string from_node = 1;      // follower node id
  string to_node = 2;        // leader node id
  int64 term = 3;            // currentTerm, for leader to update itself
  bool entry_appended = 4;   // true if follower contained entry matching prev_log_index and prev_log_term
  int64 match_index = 5;     // highest index replicated on follower
}

message InstallSnapshotRequest {
  string from_node = 1;            // leaderId
  string to_node = 2;              // follower
  int64 term = 3;                  // leader's term
  int64 last_included_index = 4;   // snapshot replaces all entries up to and including this index
  int64 last_included_term = 5;    // term of last_included_index
  string data = 6;                 // JSON-serialized state machine snapshot
  string config_json = 7;          // cluster membership as of last_included_index
}

message InstallSnapshotResponse {
  string from_node = 1;
  string to_node = 2;
  int64 term = 3;                  // currentTerm, for leader to update itself
  bool success = 4;
  int64 match_index = 5;           // follower's last_included_index after install
}

message TimeoutNowRequest {
  string from_node = 1;
  string to_node = 2;
  int64 term = 3;
}

message TimeoutNowResponse {
  string from_node = 1;
  string to_node = 2;
  int64 term = 3;
  bool success = 4;
}

// --- Cluster administration ---

message MembershipChangeRequest {
  string action = 1;      // "add" or "remove" (one server at a time)
  string node_id = 2;
  string host = 3;        // add only: address other nodes and clients use
  int32 raft_port = 4;    // add only
  int32 client_port = 5;  // add only
  string token = 6;       // session token of an admin account
}

message TransferLeadershipRequest {
  string target_node = 1; // empty = pick the most up-to-date follower
  string token = 2;       // session token of an admin account
}
