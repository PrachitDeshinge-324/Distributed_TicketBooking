[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dist-ticket-booking"
version = "0.1.0"
description = "Python-first Distributed Ticket Booking System for AOS assignment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=7.35.1"
]

[project.optional-dependencies]
llm = ["torch>=2.4", "transformers>=5.0"]
test = ["pytest>=8"]
authors = [{ name = "Team AOS" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
