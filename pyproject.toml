[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dist-ticket-booking"
version = "0.1.0"
description = "Python-first Distributed Ticket Booking System for AOS assignment"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Team AOS" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
